<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="ambGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00D8FF" stop-opacity="0.45"/>
      <stop offset="55%" stop-color="#0080FF" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>
  <g transform="translate(512, 520)">
    <!-- Backlight radial aura behind folder -->
    <ellipse cx="0" cy="10" rx="360" ry="290" fill="url(#ambGlow)"/>
    <!-- Ground contact shadow underneath folder base -->
    <ellipse cx="0" cy="216" rx="295" ry="25" fill="#000000" opacity="0.45" filter="url(#shadowBlur)"/>
  </g>
</svg>
