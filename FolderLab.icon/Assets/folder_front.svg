<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="frontGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.38"/>
      <stop offset="35%" stop-color="#2563EB" stop-opacity="0.30"/>
      <stop offset="70%" stop-color="#7C3AED" stop-opacity="0.36"/>
