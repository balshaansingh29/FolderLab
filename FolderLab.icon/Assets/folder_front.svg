    <path d="M -310 -78 C -310 -98 -295 -110 -275 -110 L 275 -110 C 295 -110 310 -98 310 -78 L 310 173 C 310 193 295 205 275 205 L -275 205 C -295 205 -310 193 -310 173 Z"
